plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gearcam'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gearcam'
        minSdk 21
        // 27 = Android 8.1 (مطابق لنظام الشاشة)
        targetSdk 27
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
